services:
  # ─────────────────────────────────────────────
  # Kafka Infrastructure (self-hosted on Hetzner)
  # ─────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: chat-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    restart: always
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://localhost:8080/commands/ruok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - chat-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: chat-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx400m -Xms256m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - chat-network

  # ─────────────────────────────────────────────
  # Application Services (5 services)
  # ─────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_NAME: auth-service
    container_name: chat-auth-service
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - chat-network

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_NAME: user-service
    container_name: chat-user-service
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3002"
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - chat-network

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_NAME: chat-service
    container_name: chat-chat-service
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3003"
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - chat-network

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_NAME: notification-service
    container_name: chat-notification-service
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3005"
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - chat-network

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_NAME: api-gateway
    container_name: chat-api-gateway
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      CHAT_SERVICE_URL: http://chat-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      KAFKA_BROKERS: kafka:9092
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - chat-network

  # ─────────────────────────────────────────────
  # Nginx — only public facing port
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: chat-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
