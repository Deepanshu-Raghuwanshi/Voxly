upstream api_gateway {
    server api-gateway:3000;
}

upstream chat_service {
    server chat-service:3003;
}

server {
    listen 80;
    server_name voxyl.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name voxyl.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/voxyl.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voxyl.duckdns.org/privkey.pem;

    client_max_body_size 10M;

    location = /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass              http://api_gateway;
        proxy_http_version      1.1;
        proxy_set_header        Host                $host;
        proxy_set_header        X-Real-IP           $remote_addr;
        proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto   $scheme;
        proxy_read_timeout      90s;
        proxy_connect_timeout   10s;
    }

    location /socket.io/ {
        proxy_pass              http://chat_service;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade             $http_upgrade;
        proxy_set_header        Connection          "upgrade";
        proxy_set_header        Host                $host;
        proxy_set_header        X-Real-IP           $remote_addr;
        proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto   $scheme;
        proxy_read_timeout      86400s;
        proxy_send_timeout      86400s;
    }

    location / {
        return 404 '{"error": "Not found. Frontend is served from Vercel."}';
        add_header Content-Type application/json;
    }
}